; PlatformIO Project Configuration File
; NFC Reader - ESP32-C3 SuperMini + PN532

; Shared settings for all environments
[env]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    https://github.com/Seeed-Studio/PN532.git

; LittleFS for web files. The web sources live in data_src/; the pre-build
; script gzips them into data/ (generated, not committed).
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/gzip_web.py

monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DASYNCWEBSERVER_REGEX
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNFC_INTERFACE_I2C

; USB upload (first flash)
[env:esp32c3_supermini]
upload_speed = 921600
; ESP32-C3 SuperMini has problems with RTS reset - use no_reset
; After upload, power cycle or press the reset button manually
upload_resetmethod = no_reset

; OTA upload over the network
[env:esp32c3_ota]
upload_protocol = espota
upload_port = nfc-reader.local
upload_flags =
    --auth=nfc-ota
