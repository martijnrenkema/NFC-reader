; PlatformIO Project Configuration File
; NFC Reader - ESP32-C3 SuperMini + PN532

[env:esp32c3_supermini]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3

; Libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    https://github.com/Seeed-Studio/PN532.git

; LittleFS for web files
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

; Serial monitor
monitor_speed = 115200

; Upload settings - Serial (eerste keer)
upload_speed = 921600
; ESP32-C3 SuperMini heeft problemen met RTS reset - gebruik no_reset
; Na upload handmatig power cycle of reset knop gebruiken
upload_resetmethod = no_reset

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DASYNCWEBSERVER_REGEX
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNFC_INTERFACE_I2C

; ESP32-C3 SuperMini OTA environment
[env:esp32c3_ota]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    https://github.com/Seeed-Studio/PN532.git

board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

upload_protocol = espota
upload_port = nfc-reader.local
upload_flags =
    --auth=nfc-ota

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DASYNCWEBSERVER_REGEX
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNFC_INTERFACE_I2C
